name: Auto Update Evening Data

on:
  schedule:
    - cron: '0 13 * * 1-5' 
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pandas pypsx-toolkit
          
      - name: Fetch Latest Data
        run: |
          python -c "
          import pypsx_toolkit as pt
          import pandas as pd
          import os
          os.makedirs('data', exist_ok=True)
          with open('symbols.txt', 'r') as f:
              syms = [line.strip() for line in f if line.strip()]
          for sym in syms:
              try:
                  df = pt.download(sym, period='400d')
                  if df is not None and not df.empty:
                      if isinstance(df.columns, pd.MultiIndex):
                          df.columns = df.columns.get_level_values(-1)
                      df = df.reset_index()
                      df.columns = [c.lower() for c in df.columns]
                      df.to_csv(f'data/{sym}.csv', index=False)
              except:
                  pass
          "
          
      - name: Commit and Push New Data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data/
          git commit -m "Auto-updated market data for $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
